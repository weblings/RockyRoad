<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChartPlayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Screens mount/unmount here — sits above canvas */
    #screen-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Persistent gear button — always on top */
    #settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    #settings-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Settings overlay: scrim + panel */
    #settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #settings-overlay.hidden { display: none; }

    #settings-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    #settings-panel {
      position: relative;
      z-index: 1;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 28px 32px;
      min-width: 340px;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #settings-panel h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    #settings-panel .placeholder {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    #settings-close {
      display: block;
      width: 100%;
      padding: 10px;
      background: #2a6eff;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    #settings-close:hover { background: #1a5ee0; }

    /* 3-2-1 countdown overlay */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 128px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #countdown-overlay.hidden { display: none; }

    /* ── Song library ──────────────────────────────────────────────────────── */
    .lib-screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, sans-serif; overflow: hidden;
    }
    .lib-splash {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
    }
    .lib-splash-inner { text-align: center; max-width: 400px; padding: 24px; }
    .lib-title  { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    .lib-subtitle { font-size: 15px; color: #888; margin-bottom: 28px; }
    .lib-btn-primary {
      display: block; width: 100%; padding: 12px;
      background: #2a6eff; border: none; border-radius: 8px;
      color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 10px;
    }
    .lib-btn-primary:hover { background: #1a5ee0; }
    .lib-btn-secondary {
      display: block; width: 100%; padding: 10px;
      background: transparent; border: 1px solid #444; border-radius: 8px;
      color: #aaa; font-size: 14px; cursor: pointer;
    }
    .lib-btn-secondary:hover { color: #fff; border-color: #666; }
    .lib-browser-note { font-size: 12px; color: #555; margin-top: 16px; line-height: 1.5; }

    .lib-bar { padding: 12px 16px 8px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
    .lib-search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .lib-search {
      flex: 1; padding: 8px 12px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
      color: #fff; font-size: 14px;
    }
    .lib-search::placeholder { color: #555; }
    .lib-search:focus { outline: none; border-color: #555; }
    .lib-sort, .lib-tuning {
      padding: 8px 10px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
    }
    .lib-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lib-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .lib-chip {
      padding: 5px 14px; border: 1px solid #333; border-radius: 20px;
      background: transparent; color: #aaa; font-size: 13px; cursor: pointer;
    }
    .lib-chip:hover { border-color: #555; color: #fff; }
    .lib-chip.active { background: #2a6eff; border-color: #2a6eff; color: #fff; }

    .lib-grid {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; align-content: start;
    }
    .lib-card {
      background: #1a1a1a; border-radius: 8px; overflow: hidden;
      cursor: pointer; border: 1px solid transparent; transition: border-color 0.15s;
    }
    .lib-card:hover { border-color: #444; }
    .lib-card:focus { outline: none; border-color: #2a6eff; }
    .lib-card-art { width: 100%; aspect-ratio: 1; background: #242424; overflow: hidden; }
    .lib-card-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-card-art-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1e1e2e 0%, #2a1a3e 100%);
    }
    .lib-card-info { padding: 10px 10px 8px; }
    .lib-card-title {
      font-size: 13px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
    }
    .lib-card-artist {
      font-size: 12px; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px;
    }
    .lib-card-album {
      font-size: 11px; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px;
    }
    .lib-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .lib-card-badges { display: flex; gap: 3px; flex-wrap: wrap; }
    .lib-badge { font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 3px; }
    .badge-lead   { background: #0d3b0d; color: #6fca6f; }
    .badge-rhythm { background: #3b250d; color: #cab86f; }
    .badge-bass   { background: #0d1f3b; color: #6fa3ca; }
    .badge-keys   { background: #25103b; color: #b06fca; }
    .badge-drums  { background: #3b0d0d; color: #ca6f6f; }
    .lib-card-diff { display: flex; gap: 2px; flex-shrink: 0; }
    .diff-bar { width: 3px; height: 12px; border-radius: 1px; background: #333; }
    .diff-bar.filled { background: #2a6eff; }

    /* ── Active scene overlay ──────────────────────────────────────────────── */
    #active-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; padding: 16px;
      background: linear-gradient(transparent 70%, rgba(0,0,0,0.5));
      cursor: pointer;
    }
    .active-back-btn {
      padding: 8px 16px; background: rgba(255,255,255,0.12);
      border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
    }
    .active-back-btn:hover { background: rgba(255,255,255,0.22); }
  </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="screen-container"></div>

    <button id="settings-btn" title="Settings">&#9881;</button>

    <div id="settings-overlay" class="hidden">
      <div id="settings-scrim"></div>
      <div id="settings-panel">
        <h2>Settings</h2>
        <p class="placeholder">Settings panel coming in Phase 6.7.</p>
        <button id="settings-close">Continue</button>
      </div>
    </div>

    <div id="countdown-overlay" class="hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
