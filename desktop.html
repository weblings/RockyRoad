<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./RockyRoad_Temp.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RockyRoad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Screens mount/unmount here — sits above canvas */
    #screen-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

/* Settings overlay: scrim + panel */
    #settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #settings-overlay.hidden { display: none; }

    #settings-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    #settings-panel {
      position: relative;
      z-index: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 28px 32px;
      min-width: 340px;
      color: #fff;
    }
    #settings-panel h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    #settings-close {
      display: block;
      width: 100%;
      padding: 10px;
      background: #dadada;
      border: none;
      border-radius: 6px;
      color: #111111;
      font-size: 15px;
      cursor: pointer;
    }
    #settings-close:hover { background: #bebebe; }

    /* 3-2-1 countdown overlay */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 128px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #countdown-overlay.hidden { display: none; }

    /* ── Song library ──────────────────────────────────────────────────────── */
    .lib-screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, sans-serif; overflow: hidden;
    }
    .lib-splash {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
    }
    .lib-splash-inner { text-align: center; max-width: 400px; padding: 24px; }
    .lib-title  { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    .lib-subtitle { font-size: 15px; color: #888; margin-bottom: 28px; }
    .lib-btn-primary {
      display: block; width: 100%; padding: 12px;
      background: #dadada; border: none; border-radius: 8px;
      color: #111111; font-size: 16px; cursor: pointer; margin-bottom: 10px;
    }
    .lib-btn-primary:hover { background: #bebebe; }
    .lib-btn-secondary {
      display: block; width: 100%; padding: 10px;
      background: transparent; border: 1px solid #444; border-radius: 8px;
      color: #aaa; font-size: 14px; cursor: pointer;
    }
    .lib-btn-secondary:hover { color: #fff; border-color: #666; }

    /* Text hierarchy */
    .text-primary   { color: #ffffff; font-weight: 700; }
    .text-secondary { color: #c8c8c8; font-weight: 400; }

    /* Demo-build-only ribbon (see SongLibraryScreen.ts's VITE_DEMO_MODE check) — a flex
       child of .lib-screen, same as .lib-bar below it, so it just takes its own row. */
    .lib-source-ribbon {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 0;
      font-size: 13px;
    }
    .lib-source-ribbon a {
      display: inline-flex; align-items: center; gap: 6px;
      color: #c8c8c8; text-decoration: none;
    }
    .lib-source-ribbon svg { fill: currentColor; }
    .lib-source-ribbon a:hover { color: #ffffff; text-decoration: underline; }

    /* Toolbar */
    .lib-bar { padding: 10px 10px 8px; background: #0a0a0a; border-bottom: 1px solid #1e1e1e; flex-shrink: 0; }
    .lib-search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .lib-search {
      flex: 1; padding: 9px 12px;
      background: #333333; border: none; border-radius: 6px;
      color: #ffffff; font-size: 13px; font-family: inherit;
    }
    .lib-search::placeholder { color: #999; }
    .lib-search:hover { background: #515151; }
    .lib-search:focus { outline: none; }

    /* Generic trigger+menu dropdown — used by Library's Sort, and (see
       ThreeCP/Analysis/DesktopDropdownSyncPlan.md) Song's Instrument/Difficulty and Play's
       Speed/Difficulty. Menu opens right-aligned under its trigger by default; screens that need
       left-aligned can override with an ad-hoc rule scoped to their own dropdown's id. */
    .dropdown { position: relative; flex: 0 0 auto; }
    .dropdown-trigger {
      display: flex; align-items: center; gap: 8px; padding: 9px 14px;
      background: #333333; border: none; border-radius: 6px;
      color: #ffffff; font-size: 13px; font-family: inherit;
      cursor: pointer; white-space: nowrap;
    }
    .dropdown-trigger:hover { background: #515151; }
    .dropdown-trigger:active { background: #7c7c7c; }
    .dropdown.open .dropdown-trigger { background: #515151; }
    .dropdown-chevron { width: 10px; height: 10px; display: block; flex-shrink: 0; }

    /* Demo-mode-only: pick a local song folder in place of a real remote server. */
    .lib-upload-btn {
      flex: 0 0 auto; width: 38px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #333333; border: none; border-radius: 6px; cursor: pointer;
    }
    .lib-upload-btn:hover { background: #515151; }
    .lib-upload-btn:active { background: #7c7c7c; }
    .lib-upload-btn img { width: 16px; height: 16px; display: block; }
    .dropdown-menu {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      flex-direction: column; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; overflow: hidden; z-index: 10; min-width: 100%;
    }
    .dropdown.open .dropdown-menu { display: flex; }
    .dropdown-option {
      padding: 8px 14px; background: none; border: none;
      color: #c8c8c8; font-size: 13px; font-family: inherit;
      text-align: left; cursor: pointer; white-space: nowrap;
    }
    .dropdown-option:hover { background: #2a2a2a; color: #fff; }
    .dropdown-option:active { background: #515151; color: #fff; }
    .dropdown-option.selected { background: #242424; color: #fff; }

    /* Trigger fills whatever width its .dropdown box ends up with (from an ancestor row/column
       layout, not its own content) and pushes the chevron to the far edge — Library's Sort
       trigger stays content-hugging, unlike Song/Play's. */
    .dropdown-fill .dropdown-trigger { width: 100%; justify-content: space-between; }
    .dropdown-fill .dropdown-menu { left: 0; right: 0; }

    /* Row of same-width dropdowns sharing the available horizontal space evenly (Song's
       Instrument + Difficulty, side by side, not stacked). Each Dropdown instance mounts into
       its own slot div (see PreSceneScreen.ts), so the sized element is .dropdown-row-item, the
       slot itself — not .dropdown, which is one level deeper and would never match here. */
    .dropdown-row { display: flex; flex-direction: row; gap: 8px; width: 100%; }
    .dropdown-row-item { flex: 1 1 0; min-width: 0; }

    /* Filter chips */
    .lib-filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lib-filter-btn {
      padding: 5px 14px; border: none; border-radius: 20px;
      font-size: 13px; font-weight: 400; cursor: pointer; font-family: inherit;
    }
    .lib-filter-btn.inactive { background: #333333; color: #ffffff; }
    .lib-filter-btn.inactive:hover { background: #515151; }
    .lib-filter-btn.inactive:active { background: #7c7c7c; }
    .lib-filter-btn.active { background: #dadada; color: #111111; }
    .lib-filter-btn.active:hover { background: #bebebe; }
    .lib-filter-btn.active:active { background: #9c9c9c; }
    .lib-tuning {
      padding: 5px 10px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit;
    }

    /* Song list — column count scales with window width, unlike XR's fixed-width
       panel (which can hardcode 3) — desktop's window has no such fixed size. */
    .lib-song-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      align-content: start; gap: 4px; padding: 10px;
      flex: 1; overflow-y: auto;
    }
    .lib-song-entry {
      position: relative;
      display: flex; flex-direction: row; align-items: flex-start;
      padding: 8px 10px; width: 100%;
      background: #242424; border: none; border-radius: 5px;
      cursor: pointer; text-align: left;
    }
    .lib-song-entry:hover { background: #2e2e2e; }
    .lib-song-entry:active { background: #383838; }
    .lib-art-thumb {
      width: 40px; height: 40px; flex: 0 0 auto;
      background: #6e6e6e; border-radius: 4px; overflow: hidden;
    }
    .lib-art-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-song-meta {
      display: flex; flex-direction: column;
      padding: 0 0 0 8px; flex: 1; min-width: 0;
    }
    /* Which instruments a song supports — bottom-right of the entry, over the
       reserved padding above so long titles never render underneath them. */
    .lib-instrument-badges {
      position: absolute; right: 10px; bottom: 8px;
      display: flex; gap: 4px;
    }
    .lib-badge {
      background: #8B8B8B; color: #111;
      font-size: 10px; font-weight: 500;
      padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    }
    /* BADGE_STYLE: 'icon' in SongLibraryScreen.ts uses this instead of .lib-badge above. */
    .lib-instrument-badges img { width: 16px; height: 16px; opacity: 0.55; display: block; }
    .lib-song-title {
      color: #fff; font-size: 12px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lib-song-album {
      color: #c8c8c8; font-size: 10px; font-weight: 400;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lib-song-artist {
      color: rgba(140,140,140,0.784); font-size: 10px; font-weight: 400;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      /* Only the last line sits under the bottom-right badge overlay, so only it needs to
         reserve space for them. SongLibraryScreen.refreshCards() sets padding-right inline
         per-card, sized to that card's *actual* rendered badge width — a flat worst-case
         value here would waste space on every song with fewer/shorter badges than the max. */
    }

    /* ── Pre-scene screen ──────────────────────────────────────────────────── */
    .pre-screen {
      position: absolute; inset: 0;
      background: #0a0a0a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      overflow-y: auto;
    }
    .pre-back {
      position: absolute; top: 16px; left: 16px;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: #333333;
      border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
    }
    .pre-back:hover { background: #515151; }
    .pre-back svg { display: block; flex-shrink: 0; }
    .pre-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; width: 100%; max-width: 360px; padding: 60px 24px 32px;
    }
    /* Groups art + title/artist so the pair can flip from the default centered "hero" stack
       to a compact side-by-side row under .pre-header's own media query below, without
       touching the dropdowns/action-row that follow — see desktop-dom.md. */
    .pre-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; width: 100%;
    }
    .pre-art {
      width: 180px; height: 180px; border-radius: 10px; overflow: hidden;
      background: #242424; margin-bottom: 4px; flex-shrink: 0;
    }
    .pre-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pre-art-placeholder { width: 100%; height: 100%; background: #242424; }
    /* Explicit width, not shrink-to-fit — .pre-header's align-items:center otherwise hugs
       this to its content's own size, letting a long title grow past the container instead
       of triggering the ellipsis rules below. */
    .pre-header-text { width: 100%; min-width: 0; }
    .pre-song-name {
      font-size: 22px; font-weight: 700; text-align: center; line-height: 1.2;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pre-artist-name {
      font-size: 15px; color: #8c8c8c; text-align: center; margin-bottom: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Fallback for constrained vertical room (e.g. landscape on mobile), where the full-size
       hero art pushes Play off-screen: shrink art to a thumbnail and lay it out beside the
       title/artist instead of above them, same compact row shape as the library card and
       XR's song-row. Keyed on actual available height, not device orientation — a landscape
       tablet has plenty of height and shouldn't trigger this (same reasoning as the library
       grid's width-based column count). */
    @media (max-height: 480px) {
      .pre-content { padding: 44px 24px 24px; gap: 8px; }
      /* Card container like XR's song-row / the library entry, instead of the thumb+text
         floating directly on the screen background — reads as a distinct row, not stray
         leftover content once it's this small. */
      .pre-header {
        flex-direction: row; align-items: center; gap: 12px;
        background: #333333; border-radius: 8px; padding: 10px 12px; width: 100%;
      }
      .pre-art { width: 56px; height: 56px; margin-bottom: 0; }
      /* flex:1 instead of the default width:100% — beside the thumb (not above it) now,
         so it needs to fill the row's remaining space, not the whole container. */
      .pre-header-text { width: auto; flex: 1 1 0; min-width: 0; text-align: left; }
      .pre-song-name, .pre-artist-name { text-align: left; }
      .pre-song-name { font-size: 16px; }
      .pre-artist-name { font-size: 13px; margin-bottom: 0; }
    }
    .pre-toggles { display: flex; flex-direction: column; width: 100%; }
    .pre-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #1e1e1e; cursor: pointer;
    }
    .pre-toggle-row:last-child { border-bottom: none; }
    .pre-toggle-label { font-size: 14px; color: #c8c8c8; }
    .pre-toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .pre-toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .pre-toggle-knob {
      position: absolute; inset: 0; border-radius: 12px;
      background: #333; transition: background 0.2s; cursor: pointer;
    }
    .pre-toggle-knob::after {
      content: ''; position: absolute;
      top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; transition: transform 0.2s;
    }
    .pre-toggle-switch input:checked + .pre-toggle-knob { background: #8b8b8b; }
    .pre-toggle-switch input:checked + .pre-toggle-knob::after { transform: translateX(18px); }
    .pre-action-row {
      width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    }
    .pre-tune-btn {
      width: 100%; padding: 10px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: #333333; border: none; border-radius: 10px;
      color: #fff; font-size: 15px; cursor: pointer;
    }
    .pre-tune-btn:hover { background: #515151; }
    .pre-tune-btn svg { display: block; flex-shrink: 0; }
    .pre-tune-btn.hidden { display: none; }
    .pre-play-btn {
      width: 100%; padding: 14px;
      /* Own margin, not the row's shared gap — gap collapses to nothing when Tune is hidden
         (Keys/non-tunable parts), which would silently undo this otherwise. */
      margin-top: 16px;
      background: #dadada; border: none; border-radius: 10px;
      color: #111111; font-size: 17px; cursor: pointer;
    }
    .pre-play-btn:hover { background: #bebebe; }

    /* ── Tuner screen ──────────────────────────────────────────────────────── */
    .tuner-screen {
      position: absolute; inset: 0;
      background: #0a0a0a; color: #fff;
      display: flex; flex-direction: column;
    }

    .tuner-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }

    .tuner-main {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    .tuner-controls-row {
      display: flex; align-items: center; gap: 8px;
    }
    .tuner-ctrl-inline { display: flex; align-items: center; gap: 6px; }
    .tuner-ctrl-label-inline { font-size: 12px; color: #8b8b8b; white-space: nowrap; }
    .tuner-ctrl-divider { width: 1px; height: 20px; background: #333; flex-shrink: 0; }

    .tuner-select {
      padding: 8px 10px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 5px; color: #fff; font-size: 13px; font-family: inherit; cursor: pointer;
    }
    .tuner-gain-slider { width: 80px; accent-color: #8b8b8b; cursor: pointer; }
    #tuner-gain-val { font-size: 12px; color: #c8c8c8; min-width: 28px; }

    .tuner-btn {
      padding: 8px 14px; background: #333333;
      border: none; border-radius: 5px; color: #ffffff; font-size: 12px;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .tuner-btn:hover { background: #515151; }
    .tuner-btn-exit { background: #dadada; color: #111111; }
    .tuner-btn-exit:hover { background: #bebebe; }

    .tuner-canvas-wrap {
      position: relative;
      background: #111; border: 1px solid #222; border-radius: 10px;
      overflow: hidden;
    }
    #tuner-canvas { display: block; }

    .tuner-complete-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); gap: 8px;
    }
    .tuner-complete-overlay.hidden { display: none; }
    .tuner-check { font-size: 72px; color: #44FF88; line-height: 1; }
    .tuner-in-tune { font-size: 20px; font-weight: 600; color: #44FF88; }

    .tuner-exit-btn {
      margin-top: 8px; padding: 10px 28px;
      background: #2a6eff; border: none; border-radius: 8px;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .tuner-exit-btn:hover { background: #1a5ee0; }

    .tuner-mic-wait {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); font-size: 13px; color: #888;
    }
    .tuner-mic-wait.hidden { display: none; }

    /* ── Active scene overlay ──────────────────────────────────────────────── */
    #active-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(rgba(0,0,0,0.55) 0%, transparent 88px);
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #active-overlay.bar-hidden { opacity: 0.12; }

    .active-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      pointer-events: auto;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Back button */
    .active-back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: #333333;
      border: none; border-radius: 5px; color: #ffffff; font-size: 12px;
      cursor: pointer; flex-shrink: 0;
    }
    .active-back-btn:hover { background: #515151; }
    .active-back-btn svg { display: block; flex-shrink: 0; }

    /* Play/pause — circular, stands out as primary action */
    .active-play-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #eeeeee; border: none; border-radius: 50%;
      color: #111111; font-size: 14px; cursor: pointer;
    }
    .active-play-btn:hover { background: #bebebe; }

    /* Time labels */
    .active-time, .active-duration {
      color: #c8c8c8; font-size: 13px; font-weight: 400;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0; min-width: 34px; text-align: center;
    }

    /* Seek bar container */
    .active-seek-wrap { flex: 1; min-width: 0; display: flex; align-items: center; }

    /* Custom seek track */
    .seek-track {
      position: relative; width: 100%; height: 14px;
      background: #333333; border-radius: 7px; cursor: pointer;
    }
    .seek-track:hover { background: #515151; }

    .seek-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: #c0c0c0; border-radius: 7px; pointer-events: none;
    }

    #active-sections { position: absolute; inset: 0; pointer-events: none; }
    .seek-section-tick {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 2px; height: 10px; background: rgba(255,255,255,0.55);
      border-radius: 1px; pointer-events: auto; cursor: default;
    }

    .seek-thumb {
      position: absolute; top: -3px;
      width: 20px; height: 20px;
      background: #dadada; border-radius: 50%; z-index: 1;
      pointer-events: none;
    }

    /* Speed/Difficulty dropdowns match the bar's other controls' vertical padding (8px, e.g.
       .active-back-btn) rather than the slightly taller default (9px) used elsewhere. */
    .active-bar .dropdown-trigger { padding-top: 8px; padding-bottom: 8px; }
  </style>

  <body>
    <canvas id="canvas"></canvas>
    <div id="screen-container"></div>

<div id="settings-overlay" class="hidden">
      <div id="settings-scrim"></div>
      <div id="settings-panel">
        <h2>Settings</h2>
        <!-- Hidden toggles kept in DOM so onToggle reads always succeed -->
        <input type="checkbox" id="s-bold-text" style="display:none" />
        <div class="pre-toggles" style="margin-bottom: 20px;">
          <div id="s-guitar-only">
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Invert strings</span>
              <span class="pre-toggle-switch">
                <input type="checkbox" id="s-invert-strings" />
                <span class="pre-toggle-knob"></span>
              </span>
            </label>
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Lefty mode</span>
              <span class="pre-toggle-switch">
                <input type="checkbox" id="s-lefty-mode" />
                <span class="pre-toggle-knob"></span>
              </span>
            </label>
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Note numbers</span>
              <div id="s-note-numbers-slot"></div>
            </label>
          </div>
          <div id="s-keys-only">
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Full 88-key range</span>
              <span class="pre-toggle-switch">
                <input type="checkbox" id="s-full-keyboard" />
                <span class="pre-toggle-knob"></span>
              </span>
            </label>
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Top-down view</span>
              <span class="pre-toggle-switch">
                <input type="checkbox" id="s-keys-top-down" />
                <span class="pre-toggle-knob"></span>
              </span>
            </label>
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Right hand color</span>
              <input type="color" id="s-keys-right-color" style="width:36px;height:28px;border:none;padding:2px;background:none;cursor:pointer;" />
            </label>
            <label class="pre-toggle-row">
              <span class="pre-toggle-label">Left hand color</span>
              <input type="color" id="s-keys-left-color" style="width:36px;height:28px;border:none;padding:2px;background:none;cursor:pointer;" />
            </label>
          </div>
        </div>
        <button id="settings-close">Continue</button>
      </div>
    </div>

    <div id="countdown-overlay" class="hidden"></div>

  </body>
</html>
