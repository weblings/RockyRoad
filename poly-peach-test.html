<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RockyRoad Poly Peach test</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; color: #eee; font-family: system-ui, sans-serif; padding: 16px; }
      h1 { font-size: 22px; margin-bottom: 12px; }
      #status { font-size: 26px; font-weight: 700; padding: 12px 16px; border-radius: 8px; background: #333; margin-bottom: 12px; }
      #status.ok { background: #1f6f3a; }
      #status.bad { background: #8a2a2a; }
      #notes { font-size: 32px; font-weight: 700; min-height: 60px; margin: 12px 0; }
      #stats { font: 20px/1.5 ui-monospace, Consolas, monospace; background: #222; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; white-space: pre-wrap; }
      button { font-size: 20px; padding: 10px 18px; margin: 0 8px 8px 0; border: 0; border-radius: 6px; background: #444; color: #fff; }
      button.active { background: #1f6f3a; }
      button:disabled { opacity: 0.4; }
      #log { font: 16px/1.4 ui-monospace, Consolas, monospace; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Poly Peach (Chromagram) note detection test</h1>
    <div id="status">Idle</div>
    <button id="start">Start mic</button>
    <button id="stop" disabled>Stop</button>
    <div id="notes"></div>
    <div id="stats"></div>
    <div id="log"></div>
    <script type="module" src="/src/polyPeachTest.ts"></script>
  </body>
</html>
