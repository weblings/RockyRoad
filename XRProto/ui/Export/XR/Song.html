<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Song Pre-Scene</title>
  <link rel="stylesheet" href="Song2.css">
</head>
<body>
  <div class="frame">
    <div class="content">
      <div class="header">
        <button class="button primary-dark" type="button">
          <span class="back-icon">←</span>
          <span class="back-label">Library</span>
        </button>
      </div>
      <div class="song-info">
        <div class="song-details">
          <div class="row">
            <div class="art-bg">
              <div class="art-image"></div>
            </div>
          </div>
          <p class="song-title">tkm</p>
          <div class="row">
            <div class="text-wrap">
              <p class="artist-name">boy pablo</p>
            </div>
          </div>
          <div class="row">
            <div class="text-wrap">
              <p class="album-name">Soy Pablo - EP</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="button primary-dark" type="button">🔄 Reposition</button>
      <button class="button primary-light" type="button">▶ Play</button>
    </div>
  </div>
</body>
</html>
