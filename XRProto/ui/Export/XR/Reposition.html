<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reposition</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="Reposition.css">
</head>
<body>
  <div class="frame">
    <div class="content">
      <div class="header">
        <button class="button primary-dark" type="button">
          <span class="back-icon">←</span>
          <span class="back-label">Library</span>
        </button>
      </div>
      <div class="controls">
        <div class="section-row">
          <div class="section">
            <div class="section-label">
              <p class="section-title">Position</p>
            </div>
            <div class="axis-row">
              <p class="axis-label">X</p>
              <button class="button secondary-dark" type="button">-</button>
              <p class="value-display">-0.000</p>
              <button class="button secondary-dark" type="button">+</button>
            </div>
            <div class="axis-row">
              <p class="axis-label">Y</p>
              <button class="button secondary-dark" type="button">-</button>
              <p class="value-display">-0.000</p>
              <button class="button secondary-dark" type="button">+</button>
            </div>
            <div class="axis-row">
              <p class="axis-label">Z</p>
              <button class="button secondary-dark" type="button">-</button>
              <p class="value-display">-0.000</p>
              <button class="button secondary-dark" type="button">+</button>
            </div>
          </div>
          <div class="section">
            <div class="section-group">
              <div class="section-label">
                <p class="section-title">Rotation</p>
              </div>
              <div class="axis-row">
                <button class="button secondary-dark" type="button">-</button>
                <p class="value-display">-0.0</p>
                <button class="button secondary-dark" type="button">+</button>
              </div>
            </div>
            <div class="section-group">
              <div class="section-label">
                <p class="section-title">Scale</p>
              </div>
              <div class="axis-row">
                <button class="button secondary-dark" type="button">-</button>
                <p class="value-display">1.000</p>
                <button class="button secondary-dark" type="button">+</button>
              </div>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-group">
            <div class="section-label">
              <p class="section-title">Increment</p>
            </div>
            <div class="axis-row">
              <button class="button secondary-dark" type="button">-</button>
              <p class="value-display">-0.000</p>
              <button class="button secondary-dark" type="button">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="button primary-dark" type="button">🔄 Full Reposition</button>
      <button class="button primary-light" type="button">▶ Play</button>
    </div>
  </div>
</body>
</html>
