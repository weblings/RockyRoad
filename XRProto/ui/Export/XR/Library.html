  <script>
    document.querySelector('.filter-row').addEventListener('click', e => {
      const btn = e.target.closest('.button');
      if (!btn) return;
      document.querySelectorAll('.filter-row .button').forEach(b => b.classList.replace('primary-light', 'primary-dark'));
      btn.classList.replace('primary-dark', 'primary-light');
    });
  </script>
