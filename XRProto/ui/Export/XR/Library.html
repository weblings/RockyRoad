  <script>
    document.querySelector('.filter-row').addEventListener('click', e => {
      const btn = e.target.closest('.button');
      if (!btn) return;
      document.querySelectorAll('.filter-row .button').forEach(b => b.classList.replace('primary-light', 'primary-dark'));
      btn.classList.replace('primary-dark', 'primary-light');
    });

    const sortDropdown = document.querySelector('.sort-dropdown');
    const sortLabel = sortDropdown.querySelector('.sort-label');

    sortDropdown.querySelector('.sort-trigger').addEventListener('click', e => {
      e.stopPropagation();
      sortDropdown.classList.toggle('open');
    });

    sortDropdown.querySelectorAll('.sort-option').forEach(opt => {
      opt.addEventListener('click', () => {
        sortLabel.textContent = opt.textContent;
        sortDropdown.querySelectorAll('.sort-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        sortDropdown.classList.remove('open');
      });
    });

    document.addEventListener('click', () => sortDropdown.classList.remove('open'));
  </script>
