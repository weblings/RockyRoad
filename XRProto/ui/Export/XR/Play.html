<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Play (Active Scene)</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="Play.css">
</head>
<body>
  <div class="frame">
    <div class="content">
      <div class="play-header">
        <button class="button primary-dark" type="button">
          <span class="back-icon">←</span>
          <span>Library</span>
        </button>
        <button class="button primary-dark" type="button">
          <span>⚙</span>
          <span>Settings</span>
        </button>
      </div>
      <div class="play-body">
        <div class="progress-row">
          <div class="progress-area">
            <div class="times">
              <span class="time-elapsed">0:01</span>
              <span class="time-total">0:55</span>
            </div>
            <div class="seek-track">
              <div class="seek-fill" style="width: 1%"></div>
              <div class="seek-thumb" style="left: 0px"></div>
            </div>
          </div>
          <button class="play-btn" type="button">▶</button>
        </div>
        <div class="song-row">
          <div class="art-thumb"></div>
          <div class="song-meta">
            <p class="song-title">Emotion (An Unwavering Heart)</p>
            <p class="song-subtitle">Super Piano 64 · Gamechops · Unplugged</p>
          </div>
          <div class="speed-control">
            <span class="speed-label">Speed</span>
            <div class="speed-row">
              <button class="button secondary-dark speed-btn" type="button">−</button>
              <span class="speed-value">1.0×</span>
              <button class="button secondary-dark speed-btn" type="button">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="button primary-dark" type="button">🔄 Reposition</button>
    </div>
  </div>
</body>
</html>
