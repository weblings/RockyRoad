<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Play (Active Scene)</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="Play.css">
</head>
<body>
  <div class="frame">
    <div class="content">
      <div class="play-header">
        <button class="button primary-dark icon-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M13.0908 14.3334C12.972 14.3334 12.9125 14.1898 12.9965 14.1058L17.7021 9.40022C17.9625 9.13987 17.9625 8.71776 17.7021 8.45741L16.2879 7.04319C16.0275 6.78284 15.6054 6.78284 15.3451 7.04319L6.8598 15.5285C6.59945 15.7888 6.59945 16.2109 6.8598 16.4713L8.27401 17.8855L8.27536 17.8868L15.3453 24.9568C15.6057 25.2172 16.0278 25.2172 16.2881 24.9568L17.7024 23.5426C17.9627 23.2822 17.9627 22.8601 17.7024 22.5998L12.9969 17.8944C12.9129 17.8104 12.9724 17.6668 13.0912 17.6668L26 17.6668C26.3682 17.6668 26.6667 17.3683 26.6667 17.0001V15.0001C26.6667 14.6319 26.3682 14.3334 26 14.3334L13.0908 14.3334Z" fill="currentColor"/></svg>
          <span>Library</span>
        </button>
        <button class="button primary-dark" type="button">
          <span>⚙</span>
          <span>Settings</span>
        </button>
      </div>
      <div class="play-body">
        <div class="progress-row">
          <div class="progress-area">
            <div class="times">
              <span class="time-elapsed">0:01</span>
              <span class="time-total">0:55</span>
            </div>
            <div class="seek-track">
              <div class="seek-fill" style="width: 1%"></div>
              <div class="seek-thumb" style="left: 0px"></div>
            </div>
          </div>
          <button class="play-btn" type="button">▶</button>
        </div>
        <div class="song-row">
          <div class="art-thumb"></div>
          <div class="song-meta">
            <p class="song-title">Emotion (An Unwavering Heart)</p>
            <p class="song-subtitle">Super Piano 64 · Gamechops · Unplugged</p>
          </div>
          <div class="speed-control">
            <span class="speed-label">Speed</span>
            <div class="speed-row">
              <button class="button secondary-dark speed-btn" type="button">−</button>
              <span class="speed-value">1.0×</span>
              <button class="button secondary-dark speed-btn" type="button">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="button primary-dark" type="button">🔄 Reposition</button>
    </div>
  </div>
</body>
</html>
