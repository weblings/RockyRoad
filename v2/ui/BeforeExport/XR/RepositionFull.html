<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#000;display:flex;align-items:flex-start;justify-content:flex-start}</style>
</head><body><!-- DEBUG EXPORT: raw uiPanel outerHTML --><div style="position: static; left: 0px; top: 0px; width: 400px; height: 300px; background: rgb(26, 26, 46); color: rgb(232, 232, 232); font-family: sans-serif; padding: 0px; box-sizing: border-box; border-radius: 8px;">

                        </div>
                        <div style="margin-bottom:3px">
                            Y <button id="ft-pym" style="background:#3a3a7a;color:#e8e8e8;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;margin:1px">-</button>
                            <span id="ft-py-val" style="display:inline-block;width:40px;text-align:center">0.000</span>
                            <button id="ft-pyp" style="background:#3a3a7a;color:#e8e8e8;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;margin:1px">+</button>
                        </div>
                        <div>
                            Z <button id="ft-pzm" style="background:#3a3a7a;color:#e8e8e8;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;margin:1px">-</button>
                            <span id="ft-pz-val" style="display:inline-block;width:40px;text-align:center">-0.050</span>
                            <button id="ft-pzp" style="background:#3a3a7a;color:#e8e8e8;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;margin:1px">+</button>
                        </div>
                    </div>

                    <div style="flex:1;text-align:center">

                            <button id="ft-rym" style="background:#3a3a7a;color:#e8e8e8;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;margin:1px">-</button>
                            <span id="ft-ry-val" style="display:inline-block;width:36px;text-align:center">0.0</span>

                        </div>
                    </div>
