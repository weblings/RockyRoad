<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#000;display:flex;align-items:flex-start;justify-content:flex-start}</style>
</head><body><!-- DEBUG EXPORT: raw uiPanel outerHTML --><div style="position: static; left: 0px; top: 0px; width: 400px; height: 300px; background: rgb(26, 26, 46); color: rgb(232, 232, 232); font-family: sans-serif; padding: 0px; box-sizing: border-box; border-radius: 8px;">
            <div style="padding:12px;font-family:sans-serif;color:#e8e8e8">
                <div style="font-size:13px;font-weight:bold;margin-bottom:10px">⚙ Settings</div>

                <div style="font-size:11px;color:#aaa;margin-bottom:5px">Key range</div>
                <div style="display:flex;gap:6px;margin-bottom:12px">
                    <button id="ss-note-range" style="flex:1;padding:6px 8px;border:none;border-radius:4px;font-size:12px;cursor:pointer;background:#333;color:#777">
                        Note range
                    </button>
                    <button id="ss-full-88" style="flex:1;padding:6px 8px;border:none;border-radius:4px;font-size:12px;cursor:pointer;background:#3a5a8a;color:#e8e8e8">
                        Full 88-key
                    </button>
                </div>

                <div style="font-size:11px;color:#aaa;margin-bottom:6px">Right hand</div>
                <div style="display:flex;gap:8px;margin-bottom:10px">
                    <div id="ss-rh-0" style="width:30px;height:30px;border-radius:50%;background:#2E71D6;cursor:pointer;box-sizing:border-box;border:3px solid #ffffff"></div><div id="ss-rh-1" style="width:30px;height:30px;border-radius:50%;background:#E33737;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-rh-2" style="width:30px;height:30px;border-radius:50%;background:#3DAA3D;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-rh-3" style="width:30px;height:30px;border-radius:50%;background:#9B59B6;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-rh-4" style="width:30px;height:30px;border-radius:50%;background:#E67E22;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-rh-5" style="width:30px;height:30px;border-radius:50%;background:#E8E8E8;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div>
                </div>

                <div style="font-size:11px;color:#aaa;margin-bottom:6px">Left hand</div>
                <div style="display:flex;gap:8px;margin-bottom:12px">
                    <div id="ss-lh-0" style="width:30px;height:30px;border-radius:50%;background:#2E71D6;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-lh-1" style="width:30px;height:30px;border-radius:50%;background:#E33737;cursor:pointer;box-sizing:border-box;border:3px solid #ffffff"></div><div id="ss-lh-2" style="width:30px;height:30px;border-radius:50%;background:#3DAA3D;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-lh-3" style="width:30px;height:30px;border-radius:50%;background:#9B59B6;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-lh-4" style="width:30px;height:30px;border-radius:50%;background:#E67E22;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div><div id="ss-lh-5" style="width:30px;height:30px;border-radius:50%;background:#E8E8E8;cursor:pointer;box-sizing:border-box;border:3px solid transparent"></div>
                </div>

                <button id="ss-done" style="display:block;width:100%;padding:9px;border:none;
                    border-radius:5px;font-size:13px;cursor:pointer;background:#3a6a3a;
                    color:#111;box-sizing:border-box">
                    ✓ Done
                </button>
            </div>
        </div></body></html>
