<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayGuitar — Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="PlayGuitar.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body>

<div class="play-overlay">
  <div class="play-bar">
    <div class="btn-group">
      <button class="play-back-btn" type="button">
        <span class="back-icon">←</span>
        <span class="back-label">Library</span>
      </button>
    </div>
    <div class="btn-group">
      <button class="play-pause-btn" type="button">▶</button>
    </div>
    <span class="time-current">0:20</span>
    <div class="seek-wrap">
      <input type="range" min="0" max="1000" value="0" />
      <div class="seek-sections">
        <div class="seek-tick"></div>
        <div class="seek-tick"></div>
        <div class="seek-tick"></div>
        <div class="seek-tick"></div>
        <div class="seek-tick"></div>
      </div>
      <div class="seek-thumb"></div>
    </div>
    <span class="time-duration">5:42</span>
    <div class="speed-control">
      <button class="speed-btn" type="button">−</button>
      <div class="speed-display">
        <span class="speed-value">0.2×</span>
      </div>
      <button class="speed-btn" type="button">+</button>
    </div>
    <div class="btn-group">
      <button class="settings-btn" type="button">
        <span class="settings-icon">⚙</span>
        <span class="settings-label">Settings</span>
      </button>
    </div>
  </div>
</div>

</body>
</html>
