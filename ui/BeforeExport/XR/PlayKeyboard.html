<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#000;display:flex;align-items:flex-start;justify-content:flex-start}</style>
</head><body><!-- DEBUG EXPORT: raw uiPanel outerHTML --><div style="position: static; left: 0px; top: 0px; width: 400px; height: 300px; background: rgb(26, 26, 46); color: rgb(232, 232, 232); font-family: sans-serif; padding: 0px; box-sizing: border-box; border-radius: 8px;">
            <div style="padding:14px;font-family:sans-serif;color:#e8e8e8">
                <div style="font-size:13px;font-weight:bold;margin-bottom:6px;
                            white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                    🎹 Fur Elise
                </div>
                <div style="display:flex;justify-content:space-between;
                            font-size:11px;color:#aaa;margin-bottom:4px">
                    <span id="as-time">0:01</span>
                    <span>0:55</span>
                </div>
                <div id="as-seek-track" style="position:relative;width:100%;height:14px;background:#555;
                            border-radius:7px;margin-bottom:10px;cursor:pointer;
                            box-sizing:border-box">
                    <div id="as-seek-fill" style="position: absolute; left: 0px; top: 0px; height: 100%; background: rgb(106, 170, 106); border-radius: 7px; width: 1.79778%;"></div>
                    
                    <div id="as-seek-thumb" style="position:absolute;top:-3px;width:20px;height:20px;
                                background:#9aca9a;border-radius:50%;left:0px;
                                box-shadow:0 0 3px rgba(0,0,0,0.6)"></div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                    <button id="as-speed-down" style="flex:0 0 auto;padding:4px 14px;border:none;border-radius:4px;font-size:15px;cursor:pointer;color:#111;background:#555">−</button>
                    <span style="flex:1;text-align:center;font-size:12px;color:#ccc">
                        1×
                    </span>
                    <button id="as-speed-up" style="flex:0 0 auto;padding:4px 14px;border:none;border-radius:4px;font-size:15px;cursor:pointer;color:#111;background:#555">+</button>
                </div>
                <button id="as-playpause" style="display:block;width:100%;padding:10px;margin-bottom:8px;border:none;border-radius:5px;font-size:14px;cursor:pointer;box-sizing:border-box;color:#111;background:#3a5a3a">
                    ▶ Play
                </button>
                <button id="as-recal" style="display:block;width:100%;padding:7px;margin-bottom:6px;border:none;border-radius:5px;font-size:12px;cursor:pointer;box-sizing:border-box;color:#111;background:#3a3a6a">
                    🔄 Reposition Piano
                </button>
                <button id="as-settings" style="display:block;width:100%;padding:7px;margin-bottom:6px;border:none;border-radius:5px;font-size:12px;cursor:pointer;box-sizing:border-box;color:#111;background:#4a4a3a">
                    ⚙ Settings
                </button>
                <button id="as-back" style="display:block;width:100%;padding:7px;margin-bottom:6px;border:none;border-radius:5px;font-size:12px;cursor:pointer;box-sizing:border-box;color:#111;background:#5a3a3a">
                    ← Library
                </button>
            </div>
        </div></body></html>
