<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Screens mount/unmount here — sits above canvas */
    #screen-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Persistent gear button — same visual style as .active-play-btn.
       Fixed top-right so it's always reachable from any screen. */
    #settings-btn {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 16px;
      width: 34px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    #settings-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Settings overlay: scrim + panel */
    #settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #settings-overlay.hidden { display: none; }

    #settings-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }

    #settings-panel {
      position: relative;
      z-index: 1;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 28px 32px;
      min-width: 340px;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #settings-panel h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    #settings-panel .placeholder {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    #settings-close {
      display: block;
      width: 100%;
      padding: 10px;
      background: #2a6eff;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    #settings-close:hover { background: #1a5ee0; }

    /* 3-2-1 countdown overlay */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 128px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #countdown-overlay.hidden { display: none; }

    /* ── Song library ──────────────────────────────────────────────────────── */
    .lib-screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, sans-serif; overflow: hidden;
    }
    .lib-splash {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
    }
    .lib-splash-inner { text-align: center; max-width: 400px; padding: 24px; }
    .lib-title  { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
    .lib-subtitle { font-size: 15px; color: #888; margin-bottom: 28px; }
    .lib-btn-primary {
      display: block; width: 100%; padding: 12px;
      background: #2a6eff; border: none; border-radius: 8px;
      color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 10px;
    }
    .lib-btn-primary:hover { background: #1a5ee0; }
    .lib-btn-secondary {
      display: block; width: 100%; padding: 10px;
      background: transparent; border: 1px solid #444; border-radius: 8px;
      color: #aaa; font-size: 14px; cursor: pointer;
    }
    .lib-btn-secondary:hover { color: #fff; border-color: #666; }
    .lib-browser-note { font-size: 12px; color: #555; margin-top: 16px; line-height: 1.5; }

    .lib-bar { padding: 12px 16px 8px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
    .lib-search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .lib-search {
      flex: 1; padding: 8px 12px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
      color: #fff; font-size: 14px;
    }
    .lib-search::placeholder { color: #555; }
    .lib-search:focus { outline: none; border-color: #555; }
    .lib-sort, .lib-tuning {
      padding: 8px 10px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
    }
    .lib-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lib-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .lib-chip {
      padding: 5px 14px; border: 1px solid #333; border-radius: 20px;
      background: transparent; color: #aaa; font-size: 13px; cursor: pointer;
    }
    .lib-chip:hover { border-color: #555; color: #fff; }
    .lib-chip.active { background: #2a6eff; border-color: #2a6eff; color: #fff; }

    .lib-grid {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px; align-content: start;
    }
    .lib-card {
      background: #1a1a1a; border-radius: 8px; overflow: hidden;
      cursor: pointer; border: 1px solid transparent; transition: border-color 0.15s;
    }
    .lib-card:hover { border-color: #444; }
    .lib-card:focus { outline: none; border-color: #2a6eff; }
    .lib-card-art { width: 100%; aspect-ratio: 1; background: #242424; overflow: hidden; }
    .lib-card-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-card-art-placeholder {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1e1e2e 0%, #2a1a3e 100%);
    }
    .lib-card-info { padding: 10px 10px 8px; }
    .lib-card-title {
      font-size: 13px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
    }
    .lib-card-artist {
      font-size: 12px; color: #888;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px;
    }
    .lib-card-album {
      font-size: 11px; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px;
    }
    .lib-card-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .lib-card-badges { display: flex; gap: 3px; flex-wrap: wrap; }
    .lib-badge { font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 3px; }
    .badge-lead   { background: #0d3b0d; color: #6fca6f; }
    .badge-rhythm { background: #3b250d; color: #cab86f; }
    .badge-bass   { background: #0d1f3b; color: #6fa3ca; }
    .badge-keys   { background: #25103b; color: #b06fca; }
    .badge-drums  { background: #3b0d0d; color: #ca6f6f; }
    .lib-card-diff { display: flex; gap: 2px; flex-shrink: 0; }
    .diff-bar { width: 3px; height: 12px; border-radius: 1px; background: #333; }
    .diff-bar.filled { background: #2a6eff; }

    /* ── Pre-scene screen ──────────────────────────────────────────────────── */
    .pre-screen {
      position: absolute; inset: 0;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow-y: auto;
    }
    .pre-back {
      position: absolute; top: 16px; left: 16px;
      padding: 8px 16px; background: rgba(255,255,255,0.1);
      border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
    }
    .pre-back:hover { background: rgba(255,255,255,0.2); }
    .pre-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; width: 100%; max-width: 360px; padding: 60px 24px 32px;
    }
    .pre-art {
      width: 180px; height: 180px; border-radius: 10px; overflow: hidden;
      background: #1e1e2e; margin-bottom: 4px; flex-shrink: 0;
    }
    .pre-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pre-art-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #1e1e2e 0%, #2a1a3e 100%); }
    .pre-song-name { font-size: 22px; font-weight: 700; text-align: center; line-height: 1.2; }
    .pre-artist-name { font-size: 15px; color: #888; text-align: center; margin-bottom: 4px; }
    .pre-section-label {
      font-size: 11px; font-weight: 600; color: #555;
      text-transform: uppercase; letter-spacing: 0.08em;
      align-self: flex-start; margin-top: 4px;
    }
    .pre-parts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
    .pre-part-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 18px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 8px; color: #aaa; font-size: 13px; cursor: pointer;
    }
    .pre-part-btn:hover { border-color: #555; color: #fff; }
    .pre-part-btn.active { background: #1a2e5a; border-color: #2a6eff; color: #fff; }
    .pre-part-type { font-weight: 600; }
    .pre-part-tuning { font-size: 11px; color: #888; }
    .pre-part-btn.active .pre-part-tuning { color: #7aacff; }
    .pre-toggles { display: flex; flex-direction: column; width: 100%; }
    .pre-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #1e1e1e; cursor: pointer;
    }
    .pre-toggle-row:last-child { border-bottom: none; }
    .pre-toggle-label { font-size: 14px; color: #ccc; }
    .pre-toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .pre-toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .pre-toggle-knob {
      position: absolute; inset: 0; border-radius: 12px;
      background: #333; transition: background 0.2s; cursor: pointer;
    }
    .pre-toggle-knob::after {
      content: ''; position: absolute;
      top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; transition: transform 0.2s;
    }
    .pre-toggle-switch input:checked + .pre-toggle-knob { background: #2a6eff; }
    .pre-toggle-switch input:checked + .pre-toggle-knob::after { transform: translateX(18px); }
    .pre-action-row {
      width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    }
    .pre-tune-btn {
      width: 100%; padding: 10px;
      background: transparent; border: 1px solid #444; border-radius: 10px;
      color: #aaa; font-size: 15px; cursor: pointer;
    }
    .pre-tune-btn:hover { border-color: #666; color: #fff; }
    .pre-tune-btn.hidden { display: none; }
    .pre-play-btn {
      width: 100%; padding: 14px;
      background: #2a6eff; border: none; border-radius: 10px;
      color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .pre-play-btn:hover { background: #1a5ee0; }

    /* ── Tuner screen ──────────────────────────────────────────────────────── */
    .tuner-screen {
      position: absolute; inset: 0;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column;
    }

    /* Top bar — mirrors the active scene bar style */
    .tuner-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 54px 10px 14px; /* right pad clears ⚙ button */
      background: rgba(0,0,0,0.55); border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0; flex-wrap: wrap;
    }
    .tuner-bar-left { display: flex; flex-direction: column; gap: 1px; }
    .tuner-title { font-size: 15px; font-weight: 700; }
    .tuner-song { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .tuner-bar-controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .tuner-ctrl-label { font-size: 11px; color: #666; display: flex; flex-direction: column; gap: 3px; }
    .tuner-select {
      padding: 5px 8px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 13px;
    }
    .tuner-gain-label { min-width: 110px; }
    .tuner-gain-row { display: flex; align-items: center; gap: 5px; }
    .tuner-gain-slider { width: 70px; accent-color: #2a6eff; cursor: pointer; }
    #tuner-gain-val { font-size: 12px; color: #aaa; min-width: 28px; }
    .tuner-btn {
      padding: 5px 12px; background: rgba(255,255,255,0.1);
      border: none; border-radius: 6px; color: #ccc; font-size: 13px;
      cursor: pointer; white-space: nowrap; line-height: 1.4;
    }
    .tuner-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .tuner-btn-exit { background: #2a6eff; color: #fff; }
    .tuner-btn-exit:hover { background: #1a5ee0; }

    /* Canvas area — fills remaining space, centers the canvas */
    .tuner-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .tuner-canvas-wrap {
      position: relative;
      background: #111; border: 1px solid #222; border-radius: 10px;
      overflow: hidden;
    }
    #tuner-canvas { display: block; }

    .tuner-complete-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); gap: 8px;
    }
    .tuner-complete-overlay.hidden { display: none; }
    .tuner-check { font-size: 72px; color: #44FF88; line-height: 1; }
    .tuner-in-tune { font-size: 20px; font-weight: 600; color: #44FF88; }

    .tuner-exit-btn {
      margin-top: 8px; padding: 10px 28px;
      background: #2a6eff; border: none; border-radius: 8px;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .tuner-exit-btn:hover { background: #1a5ee0; }

    .tuner-mic-wait {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); font-size: 13px; color: #888;
    }
    .tuner-mic-wait.hidden { display: none; }

    /* ── Active scene overlay ──────────────────────────────────────────────── */
    #active-overlay {
      position: absolute; inset: 0;
      /* gradient fades from bar bg down to transparent so the highway shows through */
      background: linear-gradient(rgba(0,0,0,0.55) 0%, transparent 88px);
      pointer-events: none;   /* overlay itself is click-through */
      transition: opacity 0.4s;
    }
    #active-overlay.bar-hidden { opacity: 0.12; }

    /* Top bar — the only pointer-interactive region */
    .active-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 54px 10px 12px; /* right pad clears the fixed ⚙ button */
      pointer-events: auto;
      font-family: system-ui, sans-serif;
    }

    /* Back + play buttons */
    .active-back-btn, .active-play-btn {
      padding: 5px 12px; background: rgba(255,255,255,0.12);
      border: none; border-radius: 6px; color: #fff; font-size: 14px;
      cursor: pointer; flex-shrink: 0; line-height: 1.4;
    }
    .active-back-btn:hover, .active-play-btn:hover { background: rgba(255,255,255,0.22); }
    .active-play-btn { width: 34px; padding: 5px; text-align: center; }

    /* Time labels */
    .active-time, .active-duration {
      color: #ccc; font-size: 13px; font-variant-numeric: tabular-nums;
      flex-shrink: 0; min-width: 34px; text-align: center;
    }

    /* Seek bar container — fills remaining space */
    .active-seek-wrap {
      flex: 1; position: relative; height: 20px;
      display: flex; align-items: center; min-width: 0;
    }
    #active-seek {
      width: 100%; accent-color: #2a6eff; cursor: pointer;
    }

    /* Section tick marks overlaid on the seek bar track */
    #active-sections { position: absolute; inset: 0; pointer-events: none; }
    .seek-section-tick {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 2px; height: 10px; background: rgba(255,255,255,0.55);
      border-radius: 1px; pointer-events: auto; cursor: default;
    }

    /* Speed compound control: [−] [select] [+] as one visual unit */
    .speed-group {
      display: flex; align-items: stretch; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; overflow: hidden;
    }
    .speed-step {
      padding: 4px 9px; background: rgba(255,255,255,0.1);
      border: none; color: #ccc; font-size: 15px; font-weight: 600;
      cursor: pointer; line-height: 1;
    }
    .speed-step:hover { background: rgba(255,255,255,0.22); color: #fff; }
    #active-speed-select {
      background: rgba(0,0,0,0.35); border: none;
      border-left: 1px solid rgba(255,255,255,0.15);
      border-right: 1px solid rgba(255,255,255,0.15);
      color: #fff; font-size: 13px; padding: 0 4px; cursor: pointer;
      text-align: center;
    }
    #active-speed-select option { background: #1a1a1a; }
  </style></head><body><!-- DEBUG EXPORT: screen-container innerHTML -->
